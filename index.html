<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFL +EV Projection Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg-color: #0B1120; --card-bg: #131E32; --border-color: #1E293B; --text-main: #F8FAFC; --text-muted: #94A3B8; --cyan-team: #00B4D8; --red-team: #FF4D4D; --gold: #F59E0B; }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 16px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 860px; display: flex; flex-direction: column; gap: 20px; }
        select { width: 100%; padding: 12px; background-color: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 8px; font-size: 16px; }
        .prediction-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; }
        .prob-row { display: flex; justify-content: space-between; margin-top: 15px; }
        .team-prob-box { display: flex; flex-direction: column; gap: 6px; flex: 1; }
        .team-prob-box.right { text-align: right; align-items: flex-end; }
        .pinny-box { display: flex; align-items: center; gap: 6px; }
        .ev-tag { font-size: 12px; font-weight: 800; padding: 2px 6px; border-radius: 4px; }
        .ev-positive { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
        .ev-negative { background: rgba(239, 68, 68, 0.15); color: #f87171; }
        .unit-rec { font-size: 11px; color: var(--gold); font-weight: bold; margin-top: 2px; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="text-align: center; color: var(--gold); margin: 0;">NFL EXPECTED VALUE SCANNER</h2>
        <select id="game-select"></select>
        
        <div class="prediction-card">
            <h3 style="text-align: center; margin: 0 0 10px 0;">MONEYLINE</h3>
            <div class="prob-row">
                <div class="team-prob-box">
                    <span id="away-name" style="font-weight: bold; color: var(--cyan-team);">Away</span>
                    <div class="pinny-box"><span id="away-ml-pinny">ML: --</span> <span id="away-ml-ev" class="ev-tag">EV: --</span></div>
                    <span id="away-ml-units" class="unit-rec">Unit Size Rec: --</span>
                </div>
                <div class="team-prob-box right">
                    <span id="home-name" style="font-weight: bold; color: var(--red-team);">Home</span>
                    <div class="pinny-box"><span id="home-ml-pinny">ML: --</span> <span id="home-ml-ev" class="ev-tag">EV: --</span></div>
                    <span id="home-ml-units" class="unit-rec">Unit Size Rec: --</span>
                </div>
            </div>
            
            <hr style="border: 1px solid var(--border-color); margin: 20px 0;">
            
            <h3 style="text-align: center; margin: 0 0 10px 0;">SPREAD</h3>
            <div class="prob-row">
                <div class="team-prob-box">
                    <div class="pinny-box"><span id="away-sp-pinny">SP: --</span> <span id="away-sp-ev" class="ev-tag">EV: --</span></div>
                    <span id="away-sp-units" class="unit-rec">Unit Size Rec: --</span>
                </div>
                <div class="team-prob-box right">
                    <div class="pinny-box"><span id="home-sp-pinny">SP: --</span> <span id="home-sp-ev" class="ev-tag">EV: --</span></div>
                    <span id="home-sp-units" class="unit-rec">Unit Size Rec: --</span>
                </div>
            </div>
        </div>
        
        <div class="prediction-card"><canvas id="spiderChart"></canvas></div>
    </div>

    <script>
        let todaysGames = [];
        let spiderChart = null;
        const stats = ['off_epa_per_play', 'off_pass_epa', 'off_rush_epa', 'def_epa_per_play', 'def_pass_epa', 'def_rush_epa'];

        function renderEV(id, ev) {
            const el = document.getElementById(id);
            if (!ev) { el.textContent = "EV: N/A"; el.className = "ev-tag"; return; }
            el.textContent = `EV: ${ev > 0 ? '+' : ''}${ev}%`;
            el.className = `ev-tag ${ev > 0 ? 'ev-positive' : 'ev-negative'}`;
        }

        fetch('./data.json?t=' + new Date().getTime(), { cache: 'no-store' })
            .then(res => res.json())
            .then(data => {
                todaysGames = data.todays_games || [];
                const sel = document.getElementById('game-select');
                todaysGames.forEach((g, i) => sel.appendChild(new Option(`${g.away_team} @ ${g.home_team}`, i)));
                initChart();
                updateDash();
            });

        function initChart() {
            spiderChart = new Chart(document.getElementById('spiderChart').getContext('2d'), {
                type: 'radar', data: { labels: stats, datasets: [ { label: 'Away', data: [], borderColor: '#00B4D8' }, { label: 'Home', data: [], borderColor: '#FF4D4D' } ] }
            });
        }

        function updateDash() {
            if(!todaysGames.length) return;
            const game = todaysGames[document.getElementById('game-select').value];
            const mkt = game.market_data || {};
            
            document.getElementById('away-name').textContent = game.away_team;
            document.getElementById('home-name').textContent = game.home_team;
            
            // ML Updates
            document.getElementById('away-ml-pinny').textContent = `ML: ${mkt.h2h?.away || 'N/A'}`;
            document.getElementById('home-ml-pinny').textContent = `ML: ${mkt.h2h?.home || 'N/A'}`;
            renderEV('away-ml-ev', mkt.away_ml_ev); renderEV('home-ml-ev', mkt.home_ml_ev);
            document.getElementById('away-ml-units').textContent = `Unit Size Rec: ${mkt.away_ml_units || 0}u`;
            document.getElementById('home-ml-units').textContent = `Unit Size Rec: ${mkt.home_ml_units || 0}u`;
            
            // Spread Updates
            document.getElementById('away-sp-pinny').textContent = `${mkt.spreads?.away_line > 0 ? '+':''}${mkt.spreads?.away_line || '-'} (${mkt.spreads?.away || 'N/A'})`;
            document.getElementById('home-sp-pinny').textContent = `${mkt.spreads?.home_line > 0 ? '+':''}${mkt.spreads?.home_line || '-'} (${mkt.spreads?.home || 'N/A'})`;
            renderEV('away-sp-ev', mkt.away_sp_ev); renderEV('home-sp-ev', mkt.home_sp_ev);
            document.getElementById('away-sp-units').textContent = `Unit Size Rec: ${mkt.away_sp_units || 0}u`;
            document.getElementById('home-sp-units').textContent = `Unit Size Rec: ${mkt.home_sp_units || 0}u`;

            // Chart Update (Scaling EPA between -0.3 and 0.3 approx)
            spiderChart.data.datasets[0].data = stats.map(s => ((game.away_offense[s] + 0.3) / 0.6) * 100);
            spiderChart.data.datasets[1].data = stats.map(s => ((game.home_offense[s] + 0.3) / 0.6) * 100);
            spiderChart.update();
        }
        document.getElementById('game-select').addEventListener('change', updateDash);
    </script>
</body>
</html>
